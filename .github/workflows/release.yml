# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# The tag Build workflow signs and verifies the archive; publication only requires PUBLISH_TOKEN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [prereleased, released]

env:
  ORG_GRADLE_PROJECT_skipWasmBuild: 'true'

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download verified release bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --pattern verified-plugin-bundle.zip --dir bundle-download
          unzip -q bundle-download/verified-plugin-bundle.zip -d verified
          python3 .github/scripts/plugin_artifact.py check --bundle verified --commit "$(git rev-parse HEAD)" --tag "$RELEASE_TAG"

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, uuid
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              changelog = (json.load(source)['release'].get('body') or '').strip()
          delimiter = str(uuid.uuid4())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changelog<<{delimiter}\n{changelog}\n{delimiter}\n')
          PYTHON

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ steps.properties.outputs.changelog != '' }}
        env:
          CHANGELOG: ${{ steps.properties.outputs.changelog }}
        run: |
          ./gradlew patchChangelog --release-note="$CHANGELOG"

      # Publish the plugin to JetBrains Marketplace
      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          python3 .github/scripts/plugin_artifact.py check --bundle verified --commit "$(git rev-parse HEAD)" --tag "$RELEASE_TAG"
          ./gradlew publishPlugin -PverifiedPluginArchive=verified/verified-plugin.zip --no-configuration-cache

      # Create a pull request
      - name: Create Pull Request
        if: ${{ steps.properties.outputs.changelog != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.properties.outputs.changelog }}
        run: |
          VERSION="$RELEASE_TAG"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          git checkout -b $BRANCH
          git commit -am "Changelog update - $VERSION"
          git push --set-upstream origin $BRANCH
          
          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          cat > "$RUNNER_TEMP/changelog-pr.md" <<EOM
          ## Changelog update for $VERSION

          This pull request updates the CHANGELOG.md file with the following changes:

          $CHANGELOG

          ---
          *This PR was automatically created by the release workflow.*
          EOM
          gh pr create \
            --title "Changelog update - $VERSION" \
            --body-file "$RUNNER_TEMP/changelog-pr.md" \
            --label "$LABEL" \
            --head "$BRANCH"
