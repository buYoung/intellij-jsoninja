# Platform fixtures and diff e2e tests run inside Gradle's IntelliJ test process.
name: IDE Integration Tests
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_skipWasmBuild: 'true'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildWasm:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup WASM Toolchain
        run: bash .github/scripts/setup-wasi.sh

      - name: Build shared WASM test resource
        working-directory: tree-sitter-wasm
        run: |
          cargo build --target wasm32-wasip1 --release
          mkdir -p "$RUNNER_TEMP/wasm"
          cp target/wasm32-wasip1/release/tree_sitter_wasm.wasm "$RUNNER_TEMP/wasm/tree-sitter.wasm"

      - name: Upload WASM test resource
        uses: actions/upload-artifact@v7
        with:
          name: tree-sitter-wasm-${{ github.sha }}
          path: ${{ runner.temp }}/wasm/tree-sitter.wasm
          if-no-files-found: error

  testUI:
    needs: buildWasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7

      - name: Download WASM test resource
        uses: actions/download-artifact@v8
        with:
          name: tree-sitter-wasm-${{ github.sha }}
          path: src/main/resources/wasm/tree-sitter

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Run tests
      - name: Tests
        run: ./gradlew test --rerun --no-configuration-cache

      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ide-tests-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/reports/tests
            build/test-results/test
