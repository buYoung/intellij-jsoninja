# Platform fixtures and diff e2e tests run inside Gradle's IntelliJ test process.
name: IDE Integration Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_skipWasmBuild: 'true'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  testUI:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Run tests
      - name: Tests
        run: ./gradlew test --no-configuration-cache

      - name: Collect test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ide-tests-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/reports/tests
            build/test-results/test
