name: Build
on:
  pull_request:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_skipWasmBuild: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_skipWasmBuild: 'false'
    outputs:
      version: ${{ steps.properties.outputs.version }}
      changelog: ${{ steps.properties.outputs.changelog }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup WASM Toolchain
        shell: bash
        run: |
          rustup target add wasm32-wasip1
          WASI_VERSION=33
          WASI_SDK_NAME="wasi-sdk-${WASI_VERSION}.0-x86_64-linux"
          WASI_SDK_ARCHIVE="${WASI_SDK_NAME}.tar.gz"
          curl -fsSL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/${WASI_SDK_ARCHIVE}" -o "$RUNNER_TEMP/$WASI_SDK_ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$WASI_SDK_ARCHIVE" -C "$RUNNER_TEMP"
          WASI_SDK_PATH="$RUNNER_TEMP/$WASI_SDK_NAME"
          echo "CC_wasm32_wasip1=$WASI_SDK_PATH/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip1=$WASI_SDK_PATH/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "WASI_SYSROOT=$WASI_SDK_PATH/share/wasi-sysroot" >> "$GITHUB_ENV"
          echo "CFLAGS_wasm32_wasip1=--sysroot=$WASI_SDK_PATH/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          ./gradlew properties --console=plain -q > "$RUNNER_TEMP/properties.txt"
          ./gradlew getChangelog --unreleased --no-header --console=plain -q > "$RUNNER_TEMP/changelog.txt"
          python3 - <<'PY'
          import os, pathlib, uuid
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          version = next(line.split(': ', 1)[1] for line in (root / 'properties.txt').read_text().splitlines() if line.startswith('version: '))
          delimiter = str(uuid.uuid4())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nchangelog<<{delimiter}\n{(root / "changelog.txt").read_text()}\n{delimiter}\n')
          PY

      - name: Compile, test, check, and package
        run: ./gradlew compileKotlin check buildPlugin --no-build-cache --no-configuration-cache

      - name: Rust Tests
        working-directory: tree-sitter-wasm
        run: cargo test

      - name: Verify packaged plugin
        run: ./gradlew verifyPlugin --no-configuration-cache

      - name: Record toolchains
        shell: bash
        run: |
          {
            java -version
            ./gradlew --version
            cat gradle/libs.versions.toml
            rustc --version --verbose
            cargo --version
            rustup target list --installed
            "$CC_wasm32_wasip1" --version
          } > build/toolchains.txt 2>&1

      - name: Record verified artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mapfile -t ARCHIVES < <(find build/distributions -maxdepth 1 -name '*.zip')
          test "${#ARCHIVES[@]}" -eq 1
          mapfile -t TESTED_PLUGIN_DIRS < <(find build/idea-sandbox -maxdepth 2 -type d -name plugins-test)
          test "${#TESTED_PLUGIN_DIRS[@]}" -eq 1
          python3 .github/scripts/plugin_artifact.py create \
            --archive "${ARCHIVES[0]}" --output build/verified \
            --commit "$(git rev-parse HEAD)" --tag "$RELEASE_TAG" \
            --tested-plugin-dir "${TESTED_PLUGIN_DIRS[0]}" \
            --wasm src/main/resources/wasm/tree-sitter/tree-sitter.wasm \
            --toolchains build/toolchains.txt --verifier-reports build/reports/pluginVerifier

      - name: Upload verified artifact
        uses: actions/upload-artifact@v7
        with:
          name: verified-plugin-${{ github.sha }}
          path: build/verified
          if-no-files-found: error

      - name: Collect verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-${{ github.sha }}
          path: |
            build/reports/tests
            build/reports/pluginVerifier
            build/test-results/test

      - name: Upload Code Coverage Report
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: codecov/codecov-action@v6
        with:
          files: ${{ github.workspace }}/build/reports/kover/report.xml

  # Run Qodana inspections and provide report
  inspectCode:
    name: Inspect code
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
      pull-requests: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      # Run Qodana inspections
      - name: Qodana - Code Inspection
        uses: JetBrains/qodana-action@v2026.1.3
        with:
          cache-default-branch-only: true

  # Only trusted tag jobs receive signing credentials or write access.
  releaseDraft:
    name: Sign verified artifact and create draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ build, inspectCode ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download verified artifact
        uses: actions/download-artifact@v8
        with:
          name: verified-plugin-${{ github.sha }}
          path: verified

      - name: Check artifact identity
        run: python3 .github/scripts/plugin_artifact.py check --bundle verified --commit "$(git rev-parse HEAD)" --tag "$RELEASE_TAG"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Sign verified plugin when configured
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin -PverifiedPluginArchive=verified/verified-plugin.zip --no-configuration-cache

      - name: Verify final release bytes
        shell: bash
        run: |
          ARCHIVE=verified/verified-plugin.zip
          if [[ -f verified/verified-plugin-signed.zip ]]; then
            ARCHIVE=verified/verified-plugin-signed.zip
          fi
          ./gradlew verifyPlugin -PverifiedPluginArchive="$ARCHIVE" --no-configuration-cache
          {
            java -version
            ./gradlew --version
            cat gradle/libs.versions.toml
          } > build/release-toolchains.txt 2>&1
          python3 .github/scripts/plugin_artifact.py create \
            --archive "$ARCHIVE" --prior-bundle verified --output release-bundle \
            --commit "$(git rev-parse HEAD)" --tag "$RELEASE_TAG" \
            --toolchains build/release-toolchains.txt \
            --verifier-reports build/reports/pluginVerifier
          cd release-bundle
          zip -qr ../verified-plugin-bundle.zip .

      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.build.outputs.changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release-bundle/verified-plugin.zip verified-plugin-bundle.zip \
            --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
